# Deploy a static site to S3 + CloudFront using OIDC role assumption (no stored AWS keys).
# Prereq (once): a GitHub OIDC provider in AWS and an IAM role whose trust policy uses
#   sts:AssumeRoleWithWebIdentity with StringEquals on
#   token.actions.githubusercontent.com:sub = repo:ORG/REPO:ref:refs/heads/main
name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write      # REQUIRED for OIDC, or configure-aws-credentials fails
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: gate on a reviewed environment.
    # environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REPLACE_ACCOUNT_ID:role/REPLACE_DEPLOY_ROLE
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync ./dist/assets s3://REPLACE_BUCKET/assets \
            --cache-control "public, max-age=31536000, immutable" --delete
          aws s3 cp ./dist/index.html s3://REPLACE_BUCKET/index.html \
            --cache-control "public, max-age=60" --content-type "text/html"
          aws s3 sync ./dist s3://REPLACE_BUCKET \
            --exclude "assets/*" --exclude "index.html" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id REPLACE_DIST_ID --paths "/*"
